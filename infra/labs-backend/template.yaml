AWSTemplateFormatVersion: "2010-09-09"
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31
Description: >
  CSC/EE 8001 class labs: sign-in (Cognito), a progress API (API Gateway and
  Lambda) and student progress storage (DynamoDB). Deploy with deploy.sh.

Parameters:
  Stage:
    Type: String
    AllowedValues: [test, prod]
    Description: prod keeps the user pool and the table if the stack is deleted.
  OwnerEmails:
    Type: CommaDelimitedList
    Description: Course owners. They are always admins and are the only ones who can add admins.
  AllowedDomains:
    Type: CommaDelimitedList
    Default: "umsystem.edu,missouri.edu,mail.missouri.edu"
    Description: Email domains allowed to create an account.
  AliasDomains:
    Type: CommaDelimitedList
    Default: "umsystem.edu,missouri.edu,mail.missouri.edu"
    Description: >
      Domains that deliver to the same mailbox for the same name. They count as one
      person, stored under the first domain.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "https://radiant-systems-lab.github.io"
    Description: Sites allowed to call the API from a browser.

Conditions:
  IsProd: !Equals [!Ref Stage, prod]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10

Resources:
  # -- storage ----------------------------------------------------------------

  LabsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - { Key: project, Value: csc-ee-8001-labs }
        - { Key: stage, Value: !Ref Stage }

  # -- sign-in ----------------------------------------------------------------

  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Only lets university addresses and listed admins create accounts.
      CodeUri: src/presignup/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref LabsTable
          OWNER_EMAILS: !Join [",", !Ref OwnerEmails]
          ALLOWED_DOMAINS: !Join [",", !Ref AllowedDomains]
          ALIAS_DOMAINS: !Join [",", !Ref AliasDomains]
      LoggingConfig:
        LogGroup: !Ref PreSignUpLogs
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt LabsTable.Arn

  PreSignUpLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreSignUpFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt PeoplePool.Arn

  # Named People rather than UserPool: usernames changed from email to the folded
  # address, which Cognito can only do in a new pool.
  PeoplePool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      UserPoolName: !Sub csc-ee-8001-labs-${Stage}-people
      UserPoolTier: LITE
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your CSC/EE 8001 lab verification code
        EmailMessage: >-
          Your verification code for the CSC/EE 8001 class labs is {####}.
          Enter it on the lab page to finish signing in.
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      UserPoolTags:
        project: csc-ee-8001-labs
        stage: !Ref Stage

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: labs-web
      UserPoolId: !Ref PeoplePool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days
      ReadAttributes: [email, email_verified]
      WriteAttributes: [email]

  # -- API --------------------------------------------------------------------

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, PUT, POST, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      Auth:
        DefaultAuthorizer: CognitoIdToken
        Authorizers:
          CognitoIdToken:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${PeoplePool}
              audience:
                - !Ref UserPoolClient

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Saves and returns lab progress; admin routes for the dashboard.
      CodeUri: src/api/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref LabsTable
          OWNER_EMAILS: !Join [",", !Ref OwnerEmails]
          ALIAS_DOMAINS: !Join [",", !Ref AliasDomains]
          USER_POOL_ID: !Ref PeoplePool
      LoggingConfig:
        LogGroup: !Ref ApiLogs
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !GetAtt LabsTable.Arn
                - !Sub "${LabsTable.Arn}/index/GSI1"
            # For confirming accounts whose emailed code never arrived.
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminConfirmSignUp
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminUserGlobalSignOut
              Resource: !GetAtt PeoplePool.Arn
      Events:
        Me:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /me }
        GetProgress:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/labs/{lab}/progress" }
        PutProgress:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: "/labs/{lab}/progress" }
        AdminLabs:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /admin/labs }
        AdminLabProgress:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/admin/labs/{lab}/progress" }
        AdminLockLab:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: "/admin/labs/{lab}/lock" }
        AdminLockStudent:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: "/admin/labs/{lab}/students/{student}/lock" }
        AdminListAdmins:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /admin/admins }
        AdminAddAdmin:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /admin/admins }
        AdminRemoveAdmin:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: "/admin/admins/{email}" }
        AdminPendingAccounts:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /admin/accounts/pending }
        AdminConfirmAccounts:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /admin/accounts/confirm }
        AdminRemoveAccount:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: "/admin/accounts/{username}" }
        AdminFindAccount:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/admin/accounts/{username}" }
        AdminResetPassword:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /admin/accounts/reset-password }

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref PeoplePool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Region:
    Value: !Ref AWS::Region
  AliasDomains:
    Value: !Join [",", !Ref AliasDomains]
  TableName:
    Value: !Ref LabsTable
