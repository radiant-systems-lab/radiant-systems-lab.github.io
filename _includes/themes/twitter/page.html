{% if page.title %}
<div class="page-header" style="margin-top:0; padding-top:0;">
  <h2 style="margin-top:0;">
    {{ page.title }}
    {% if page.tagline %}
      <small>{{ page.tagline }}</small>
    {% endif %}
  </h2>
</div>
{% endif %}

{% if content %}
<div class="row-fluid" style="margin-bottom:0; padding-bottom:0;">
  <div class="span12" style="margin-bottom:0; padding-bottom:0;">
    {{ content }}
  </div>
</div>
{% endif %}
