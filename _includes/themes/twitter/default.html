<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
    {% if page.keywords %}<meta name="keywords" content="{{ page.keywords }}">{% endif %}
    <meta name="author" content="{{ site.author.name }}">

    <!-- Enable responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Le HTML5 shim, for IE6-8 support of HTML elements -->
    <!--[if lt IE 9]>
      <script src="http://html5shim.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <!-- Le styles -->
    <link href="{{ ASSET_PATH }}/bootstrap/css/bootstrap.2.2.2.min.css" rel="stylesheet">
    <link href="{{ ASSET_PATH }}/css/style.css?body=1" rel="stylesheet" type="text/css" media="all">
    <link href="{{ ASSET_PATH }}/css/kbroman.css" rel="stylesheet" type="text/css" media="all">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Le fav and touch icons -->
    <link rel="SHORTCUT ICON" href="{{ BASE_PATH }}/me.ico"/>

    <!-- atom & rss feed -->
    <link href="{{ BASE_PATH }}{{ site.JB.atom_path }}" type="application/atom+xml" rel="alternate" title="Sitewide ATOM Feed">
    <link href="{{ BASE_PATH }}{{ site.JB.rss_path }}" type="application/rss+xml" rel="alternate" title="Sitewide RSS Feed">
  </head>

  <body>
    <div class="navbar">
      <div class="navbar-inner">
        <div class="container-narrow">
          <!--<a class="brand" href="{{ HOME_PATH }}">{{ site.title }}</a>-->
          <ul class="nav home-nav">
            <li>
              <a class="home-button" href="{{ BASE_PATH }}/" title="Home">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M8 3.293l6 6V15h-4v-4H6v4H2v-5.707l6-6z"/>
                  <path fill-rule="evenodd" d="M7.293 1.5a1 1 0 0 1 1.414 0l6.647 6.646a.5.5 0 0 1-.708.708L8 2.207 1.354 8.854a.5.5 0 1 1-.708-.708L7.293 1.5z"/>
                </svg>
              </a>
            </li>
          </ul>
          <ul class="nav">
              <li><a href="{{ BASE_PATH }}/about.html">About</a></li>
              <li><a href="{{ BASE_PATH }}/research.html">Research</a></li>
              <li><a href="{{ BASE_PATH }}/people.html">People</a></li>
              <li><a href="{{ BASE_PATH }}/pubs.html">Publications</a></li>
              <li><a href="{{ BASE_PATH }}/software.html">Software</a></li>
          </ul>
        </div>
      </div>
    </div>

    <div class="container-narrow">

      <div class="content">
        {{ content }}
      </div>
      <hr>

    </div>

    {% include JB/analytics %}
    <footer class="site-footer">
      <div class="container-fluid footer-container">
        <!-- Left: copyright -->
        <div class="footer-section">
          &copy; {{ "now" | date: "%Y" }} All rights reserved.
        </div>
    
        <!-- Center: contact & social -->
        <div class="footer-section">
          <a href="{{ BASE_PATH }}/contact.html">Contact Us</a>
          <a href="https://github.com/yourusername" target="_blank" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://linkedin.com/in/yourusername" target="_blank" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
          </a>
        </div>
    
        <!-- Right: quick links -->
        <ul class="footer-section quick-links">
          <li><a href="{{ BASE_PATH }}/about.html">About</a></li>
          <li><a href="{{ BASE_PATH }}/research.html">Research</a></li>
          <li><a href="{{ BASE_PATH }}/people.html">People</a></li>
          <li><a href="{{ BASE_PATH }}/pubs.html">Publications</a></li>
          <li><a href="{{ BASE_PATH }}/software.html">Software</a></li>
        </ul>
      </div>
    </footer>
  </body>
</html>
