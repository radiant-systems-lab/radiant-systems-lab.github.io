- id: week_01
  number: 1
  week: 1
  slug: week_01
  title: 'Why the Model Is Not the System'
  status: available
  kind: notebook
  topic: 'Introduction to ML Systems'
  due: '2026-09-02'
  estimated_minutes: 10
  url: /labs/week_01/
  summary: >
    Training a model is the part you already know how to do. This lab is about the part
    that decides whether anyone ever gets to use it. It ends with a decision you have to
    defend: 200 people a second, one machine, and a promise about how long they wait.
  objectives:
    - 'Explain why a good accuracy score does not mean a system is ready to use.'
    - 'Say where the time actually goes when a system answers a request.'
    - 'Defend a design decision with numbers instead of a hunch.'

- id: week_02
  number: 2
  week: 2
  slug: week_02
  title: 'Where Does It Actually Run?'
  status: available
  kind: notebook
  topic: 'Types of ML Systems'
  due: '2026-09-09'
  estimated_minutes: 30
  url: /labs/week_02/
  summary: >
    A trained model is really just a very long list of numbers, and those numbers have
    to live on a real machine. Will they fit? And once they do, how long does the machine
    take to read them all before it can answer anyone? Two questions, four machines, and
    an ending that catches most people out.
  objectives:
    - 'Work out on paper whether a model will fit on a given machine.'
    - 'Say what to do when it does not fit.'
    - 'Split the time it takes to answer into three parts and find the slow one.'
    - 'Explain why the slow part changes when you send more work at once.'

- id: week_03
  number: 3
  week: 3
  slug: week_03
  title: 'The Constraint You Found Too Late'
  status: available
  kind: notebook
  topic: 'ML Workflows'
  due: '2026-09-16'
  estimated_minutes: 45
  url: /labs/week_03/
  summary: >
    Four months of work, a model that scores 95 per cent, and a tablet it was never going
    to fit on. This lab is about the stages of an ML project, the direction trouble travels
    along them, and what each stage has to hand the next one so that a problem gets caught
    by a machine rather than by a patient.
  objectives:
    - 'Name the five stages, and say what makes them a loop rather than a line.'
    - 'Trace a deployment constraint backwards to the stages that have to absorb it.'
    - 'Say what one stage owes the next, and what breaks when it is not handed over.'
    - 'Explain how a system can fail while every log line says it is healthy.'
    - 'Say what a scheduler does that a timer cannot.'
