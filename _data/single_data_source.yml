    DOI: '10.1109/e-Science62913.2024.10678673'

- id: P-2023-92
  Publication:
    rank: 92
    date: '2023-01-01'
    pubType: article
    categories: [CP]
    title: 'Comparing containerization-based approaches for reproducible computational modeling of environmental systems'
    authors: 'Choi, Y., Roy, B., Nguyen, J., Ahmad, R., Maghami, I., Nassar, A., Li, Z., Castronova, A., Malik, T., Wang, S., and Goodall, J.'
    journal: 'Environmental Modelling & Software'
    year: 2023
    citationKey: 'CHOI2023105760'
    abstract: 'Creating online data repositories that follow Findable, Accessible, Interoperable, and Reusable (FAIR) principles
      has been a significant focus in the research community to address the reproducibility crisis facing many
      computational fields, including environmental modeling. However, less work has focused on another reproducibility challenge: capturing modeling software and computational environments needed to reproduce complex modeling workflows. Containerization technology offers an opportunity to address this need, and there are a
      growing number of strategies being put forth that leverage containerization to improve the reproducibility of
      environmental modeling. This research compares ten such approaches using a hydrologic model application as a
      case study. For each approach, we use both quantitative and qualitative metrics for comparing the different
      strategies. Based on the results, we discuss challenges and opportunities for containerization in environmental
      modeling and recommend best practices across both research and educational use cases for when and how to
      apply the different containerization-based strategies'
