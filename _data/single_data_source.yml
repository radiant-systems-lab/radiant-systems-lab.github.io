        text: "PDF"
        url: "http://sites.computer.org/debull/A14dec/p27.pdf"
    Publisher: 'IEEE'
    Volume: '37(4)'
    Pages: '27-42'

- id: P-2021-90
  Publication:
    rank: 90
    date: '2021-09-01'
    pubType: article
    categories: [SC]
    title: 'Reproducibility Practice in High Performance Computing: Community Survey Results'
    authors: 'Plale, B., Malik, T., and Pouchard, L.'
    journal: 'IEEE Computing in Science and Engineering'
    year: 2021
    citationKey: '9547695'
    abstract: 'The integrity of science and engineering research is grounded in assumptions of rigor and transparency on the part of those engaging in such research. HPC community effort to strengthen rigor and transparency take the form of reproducibility efforts. In a recent survey of the SC conference community, we collected information about the SC reproducibility initiative activities. We present the survey results in this article. Results show that the reproducibility initiative activities have contributed to higher levels of awareness on the part of SC conference technical program participants, and hint at contributing to greater scientific impact for the published papers of the SC conference series. Stringent point-of-manuscript-submission verification is problematic for reasons we point out, as are inherent difficulties of computational reproducibility in HPC. Future efforts should better decouple the community educational goals from goals that specifically strengthen a research work’s potential for long-term impact through reuse 5–10 years down the road.'
