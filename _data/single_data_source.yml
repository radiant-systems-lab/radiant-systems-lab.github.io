- id: P-2025-87
  Publication:
    rank: 87                          # set per your ordering
    date: '2025-06-22'
    pubType: article
    categories: [TEAI]
    title: 'Accurate Differential Analysis using Record and Selective Replay'
    authors: 'Nakamura, Y., Chu, X., Laguna, I., and Malik, T.'
    journal: '37th International Conference on Scalable Scientific Data Management'
    year: 2025
    citationKey: ''
    abstract: "This is a novel method for debugging and verifying the reproducibility of parallel MPI applications when both inputs and message exchange orders change. Traditional record-and-replay tools often produce numerous false positives because they cannot distinguish between execution divergences caused by intentional input changes and those caused by non-deterministic network timing. To solve this, the authors propose selective replay, a technique that replays recorded message orders only when the current execution path aligns with the original run. By unrolling control-flow graphs to uniquely identify execution locations, the proposed system can precisely pinpoint where code logic diverges and converges. Experimental results on complex scientific libraries demonstrate that this approach reduces false positives by over 50% compared to existing methods, providing developers with significantly clearer insights into how specific input modifications affect large-scale parallel software."
