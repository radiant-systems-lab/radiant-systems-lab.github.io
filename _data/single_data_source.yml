- id: P-2014-91
  Publication:
    rank: 91
    date: '2014-01-01'
    pubType: article
    categories: [SC]
    title: 'Plenario: An Open Data Discovery and Exploration Platform for Urban Science'
    authors: 'Catlett, C., Malik, T., Goldstein, B., Giuffrida, J., Shao, Y., Panella, A., Eder, D., van Zanten, E., Mitchum, R., Thaler, S., and Foster, I.'
    journal: 'IEEE Data Engineering Bulletin'
    year: 2014
    citationKey: 'CatlettMGGSPEZM14'
    abstract: 'The past decade has seen the widespread release of open data concerning city services, conditions, and
      activities by government bodies and public institutions of all sizes. Hundreds of open data portals now
      host thousands of datasets of many different types. These new data sources represent enormous po
      tential for improved understanding of urban dynamics and processes—and, ultimately, for more livable,
      efficient, and prosperous communities. However, those who seek to realize this potential quickly discover
      that discovering and applying those data relevant to any particular question can be extraordinarily dif
      ficult, due to decentralized storage, heterogeneous formats, and poor documentation. In this context,
      we introduce Plenario, a platform designed to automating time-consuming tasks associated with the
      discovery, exploration, and application of open city data—and, in so doing, reduce barriers to data use
      for researchers, policymakers, service providers, journalists, and members of the general public. Key
      innovations include a geospatial data warehouse that allows data from many sources to be registered
      into a common spatial and temporal frame; simple and intuitive interfaces that permit rapid discovery
      and exploration of data subsets pertaining to a particular area and time, regardless of type and source;
      easy export of such data subsets for further analysis; a user-configurable data ingest framework for
      automated importing and periodic updating of new datasets into the data warehouse; cloud hosting for
      elastic scaling and rapid creation of new Plenario instances; and an open source implementation to
      enable community contributions. We describe here the architecture and implementation of the Plenario
      platform, discuss lessons learned from its use by several communities, and outline plans for future work.'
